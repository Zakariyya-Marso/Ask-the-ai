<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard - Ask The AI</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <main class="container">
    <div class="top">
      <h1>Bot Configuration Dashboard</h1>
      <a class="btn secondary" href="/auth/logout">Logout</a>
    </div>

    <p id="welcome"></p>

    <label for="guildSelect">Select a server</label>
    <select id="guildSelect"></select>

    <label for="channelSelect">Select a channel</label>
    <select id="channelSelect"></select>

    <button id="saveBtn" class="btn">Save Configuration</button>
    <p id="status"></p>
  </main>
  <script src="/app.js"></script>
</body>
</html>
